<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Marriage View">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C152"/>
      <stop offset="1" stop-color="#B5912A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed burgundy backdrop for maskable safe-zone -->
  <rect width="512" height="512" fill="#7A0F2E"/>

  <!-- Scaled into the 80% safe zone -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Ring -->
    <g transform="translate(256, 96)">
      <ellipse cx="0" cy="18" rx="60" ry="14" fill="none" stroke="url(#gold)" stroke-width="10"/>
      <path d="M -18 -2 L 0 -42 L 18 -2 L 0 12 Z" fill="url(#gold)"/>
      <path d="M -18 -2 L 0 12 L 18 -2 L 8 -22 L -8 -22 Z" fill="#F5DC7A" opacity="0.55"/>
    </g>

    <!-- Heart on the burgundy backdrop: use cream + rose so it reads on burgundy -->
    <path
      d="M256 432 C 100 322, 64 232, 64 168 C 64 116, 108 80, 156 80 C 200 80, 240 108, 256 152 L 256 432 Z"
      fill="#F7F3F0"
    />
    <path
      d="M256 432 C 412 322, 448 232, 448 168 C 448 116, 404 80, 356 80 C 312 80, 272 108, 256 152 L 256 432 Z"
      fill="#E7A5A5"
    />

    <!-- Camera -->
    <g transform="translate(256, 260)">
      <rect x="-50" y="-30" width="80" height="60" rx="10" fill="url(#gold)"/>
      <path d="M 30 -18 L 56 -32 L 56 32 L 30 18 Z" fill="url(#gold)"/>
      <circle cx="-12" cy="0" r="14" fill="#5C0822" opacity="0.75"/>
      <circle cx="-12" cy="0" r="6" fill="#F5DC7A" opacity="0.85"/>
    </g>
  </g>
</svg>
