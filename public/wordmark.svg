<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Marriage View">
  <style>
    .word { font-family: "Fraunces", "Georgia", serif; font-weight: 600; font-style: normal; }
    .tag  { font-family: "Fraunces", "Georgia", serif; font-weight: 500; letter-spacing: 0.32em; }
  </style>
  <!-- Marriage in burgundy -->
  <text class="word" x="0" y="120" font-size="120" fill="#7A0F2E">Marriage</text>
  <!-- View in gold -->
  <text class="word" x="450" y="120" font-size="120" fill="#D4AF37">View</text>
  <!-- Tiny burgundy heart over the i in Marriage -->
  <path
    transform="translate(322, 28) scale(0.05)"
    d="M256 432 C 100 322, 64 232, 64 168 C 64 116, 108 80, 156 80 C 200 80, 240 108, 256 152 C 272 108, 312 80, 356 80 C 404 80, 448 116, 448 168 C 448 232, 412 322, 256 432 Z"
    fill="#7A0F2E"
  />
  <!-- Gold rule + tagline -->
  <line x1="80" y1="160" x2="170" y2="160" stroke="#D4AF37" stroke-width="2"/>
  <text class="tag" x="180" y="166" font-size="14" fill="#7A0F2E">VIDEO DATING FOR MARRIAGE-MINDED SINGLES</text>
  <line x1="640" y1="160" x2="700" y2="160" stroke="#D4AF37" stroke-width="2"/>
</svg>
